<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bear chapter rewards</title>
  <style>
    :root { color-scheme: light; --ink: #243842; --sage: #91a185; --paper: #f4f1e9; --line: rgba(36,56,66,.13); }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 15px/1.45 Manrope, Avenir Next, sans-serif; }
    header { position: sticky; z-index: 10; top: 0; display: grid; grid-template-columns: minmax(240px, 310px) 1fr auto; align-items: center; gap: 28px; padding: 16px clamp(18px, 4vw, 54px); border-bottom: 1px solid var(--line); background: rgba(244,241,233,.94); backdrop-filter: blur(16px); }
    .brand { position: relative; width: 100%; aspect-ratio: 2; }
    .brand-lockup { display: block; width: 100%; height: 100%; }
    .brand-mark { position: absolute; top: 2.22%; left: 0; width: 32.64%; height: 86.67%; object-fit: contain; pointer-events: none; }
    h1 { margin: 0; font: 400 clamp(24px, 3vw, 38px)/1.05 Iowan Old Style, Baskerville, serif; }
    header p { margin: 6px 0 0; color: rgba(36,56,66,.65); }
    button { border: 1px solid rgba(36,56,66,.24); border-radius: 999px; padding: 10px 16px; color: inherit; background: rgba(255,255,255,.6); font: inherit; cursor: pointer; }
    button:hover { border-color: var(--sage); background: #fff; }
    main { max-width: 1560px; margin: 0 auto; padding: 30px clamp(18px, 4vw, 54px) 72px; }
    .sequence-note { display: grid; grid-template-columns: auto 1fr auto 1fr; align-items: center; gap: 12px; margin-bottom: 30px; padding: 18px 22px; border: 1px solid var(--line); border-radius: 22px; background: rgba(255,255,255,.42); }
    .phase { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; color: #fff; background: var(--sage); font-weight: 800; }
    .sequence-note strong { display: block; margin-bottom: 2px; }
    .sequence-note span:not(.phase) { color: rgba(36,56,66,.65); }
    .medal-section { margin-bottom: 38px; }
    .section-heading { margin: 0 0 16px; font: 400 29px/1.1 Iowan Old Style, Baskerville, serif; }
    .medal-shelf { display: grid; grid-template-columns: repeat(auto-fit, minmax(106px, 1fr)); gap: 12px; }
    .medal-button { display: grid; justify-items: center; gap: 7px; min-width: 0; padding: 10px 7px 9px; border-radius: 18px; background: rgba(255,255,255,.36); }
    .medal-button img { display: block; width: min(92px, 100%); aspect-ratio: 1; object-fit: contain; }
    .medal-button small { overflow: hidden; max-width: 100%; text-overflow: ellipsis; white-space: nowrap; color: rgba(36,56,66,.72); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }
    article { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 24px; background: rgba(255,255,255,.62); box-shadow: 0 16px 38px rgba(36,56,66,.07); }
    .animation-stage { position: relative; width: 100%; aspect-ratio: 1; overflow: hidden; background: #f7f2e9; }
    .animation-stage > img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; transition: opacity 180ms ease; }
    .performance { opacity: 0; }
    article.is-performing .intro { opacity: 0; }
    article.is-performing .performance { opacity: 1; }
    .medal-pin { position: absolute; z-index: 2; top: 12px; right: 12px; width: 74px; height: 74px; filter: drop-shadow(0 7px 10px rgba(36,56,66,.16)); }
    .caption { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 12px; padding: 14px 16px 17px; }
    .level { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: #fff; background: var(--sage); font-weight: 700; }
    h2 { overflow: hidden; margin: 0; text-overflow: ellipsis; white-space: nowrap; font: 400 21px/1.1 Iowan Old Style, Baskerville, serif; }
    .play-one { padding: 7px 11px; font-size: 13px; }
    @media (max-width: 760px) {
      header { position: relative; grid-template-columns: 1fr; gap: 10px; }
      .brand { width: min(300px, 78vw); }
      .sequence-note { grid-template-columns: auto 1fr; }
      .grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand" role="img" aria-label="Ear Trainer — Functional Listening">
      <img class="brand-lockup" src="assets/brand/ear-trainer-lockup.svg" alt="" aria-hidden="true">
      <img class="brand-mark" src="assets/brand/ear-bear-mark-approved.png" alt="" aria-hidden="true">
    </div>
    <div><h1>Chapter reward bears</h1><p>Shared arrival A · authored performance B · achievement medal</p></div>
    <button id="replay" type="button">Replay all with sound</button>
  </header>
  <main>
    <section class="sequence-note" aria-label="Animation structure">
      <span class="phase">A</span><div><strong>Arrival</strong><span>Clearing stays still; the neutral bear grows out of a point.</span></div>
      <span class="phase">B</span><div><strong>Performance</strong><span>The original instrument poses begin without being redrawn.</span></div>
    </section>
    <section class="medal-section" aria-labelledby="medalHeading">
      <h2 class="section-heading" id="medalHeading">Achievement medals</h2>
      <div class="medal-shelf" id="medals"></div>
    </section>
    <section aria-labelledby="rewardHeading">
      <h2 class="section-heading" id="rewardHeading">Full A + B sequences</h2>
      <div class="grid" id="rewards"></div>
    </section>
  </main>
  <script>
    const rewardData = {
      intro: { src: "intro-bear-arrival.webp", durationMs: 1640 },
      rewards: [
        { level: 1, name: "Triangle", src: "level-01-triangle.webp", medal: "medals/level-01-triangle.png" },
        { level: 2, name: "Orchestral cymbals", src: "level-02-cymbals.webp", medal: "medals/level-02-cymbals.png" },
        { level: 3, name: "Tuba", src: "level-03-tuba.webp", medal: "medals/level-03-tuba.png" },
        { level: 4, name: "Harp", src: "level-04-harp.webp", medal: "medals/level-04-harp.png" },
        { level: 5, name: "Bass guitar", src: "level-05-bass-guitar.webp", medal: "medals/level-05-bass-guitar.png" },
        { level: 6, name: "Drum kit", src: "level-06-drum-kit.webp", medal: "medals/level-06-drum-kit.png" },
        { level: 7, name: "Keytar", src: "level-07-keytar.webp", medal: "medals/level-07-keytar.png" },
        { level: 8, name: "Upright bass", src: "level-08-upright-bass.webp", medal: "medals/level-08-upright-bass.png" },
        { level: 9, name: "Flute", src: "level-09-flute.webp", medal: "medals/level-09-flute.png" },
        { level: 10, name: "Violin", src: "level-10-violin.webp", medal: "medals/level-10-violin.png" },
        { level: 11, name: "Electric guitar", src: "level-11-electric-guitar.webp", medal: "medals/level-11-electric-guitar.png" },
        { level: 12, name: "Vibraphone", src: "level-12-vibraphone.webp", medal: "medals/level-12-vibraphone.png" },
        { level: 13, name: "Saxophone", src: "level-13-saxophone.webp", medal: "medals/level-13-saxophone.png" },
        { level: 14, name: "Trumpet", src: "level-14-trumpet.webp", medal: "medals/level-14-trumpet.png" },
        { level: 15, name: "Balalaika", src: "level-15-balalaika.webp", medal: "medals/level-15-balalaika.png" },
        { level: 16, name: "Musical saw", src: "level-16-musical-saw.webp", medal: "medals/level-16-musical-saw.png" }
      ]
    };

    const assetPath = (src) => `assets/bears/rewards/${src}`;
    const refresh = (image) => {
      const src = image.src.split("?")[0];
      image.src = `${src}?replay=${Date.now()}`;
    };

    const renderMedals = () => {
      const shelf = document.querySelector("#medals");
      shelf.replaceChildren(...rewardData.rewards.map((item) => {
        const button = document.createElement("button");
        button.className = "medal-button";
        button.type = "button";
        button.dataset.level = item.level;
        button.setAttribute("aria-label", `Play level ${item.level}: ${item.name}`);
        const image = document.createElement("img");
        image.src = assetPath(item.medal);
        image.alt = "";
        const label = document.createElement("small");
        label.textContent = `${item.level}. ${item.name}`;
        button.append(image, label);
        return button;
      }));
    };

    const renderRewards = () => {
      const container = document.querySelector("#rewards");
      container.replaceChildren(...rewardData.rewards.map((item) => {
        const card = document.createElement("article");
        card.dataset.level = item.level;
        const stage = document.createElement("div");
        stage.className = "animation-stage";
        const intro = document.createElement("img");
        intro.className = "intro";
        intro.src = assetPath(rewardData.intro.src);
        intro.alt = "Neutral bear appearing from a point on the clearing";
        const performance = document.createElement("img");
        performance.className = "performance";
        performance.src = assetPath(item.src);
        performance.alt = `Animated bear playing ${item.name.toLowerCase()}`;
        stage.append(intro, performance);

        const medal = document.createElement("img");
        medal.className = "medal-pin";
        medal.src = assetPath(item.medal);
        medal.alt = "";

        const caption = document.createElement("div");
        caption.className = "caption";
        const level = document.createElement("span");
        level.className = "level";
        level.textContent = item.level;
        const title = document.createElement("h2");
        title.textContent = item.name;
        const play = document.createElement("button");
        play.className = "play-one";
        play.type = "button";
        play.textContent = "Play";
        caption.append(level, title, play);
        card.append(stage, medal, caption);
        return card;
      }));
    };

    const playCard = (card) => {
      window.clearTimeout(card._performanceTimer);
      card.classList.remove("is-performing");
      const intro = card.querySelector(".intro");
      const performance = card.querySelector(".performance");
      refresh(intro);
      card._performanceTimer = window.setTimeout(() => {
        refresh(performance);
        card.classList.add("is-performing");
      }, rewardData.intro.durationMs);
    };

    let audioContext;
    const audio = () => audioContext || (audioContext = new (window.AudioContext || window.webkitAudioContext)());
    const playCrunch = (context, at, pitch) => {
      const buffer = context.createBuffer(1, Math.round(context.sampleRate * .08), context.sampleRate);
      const data = buffer.getChannelData(0);
      for (let index = 0; index < data.length; index += 1) data[index] = (Math.random() * 2 - 1) * (1 - index / data.length);
      const source = context.createBufferSource();
      const filter = context.createBiquadFilter();
      const gain = context.createGain();
      source.buffer = buffer;
      filter.type = "bandpass";
      filter.frequency.value = pitch;
      filter.Q.value = .8;
      gain.gain.setValueAtTime(.0001, at);
      gain.gain.exponentialRampToValueAtTime(.045, at + .012);
      gain.gain.exponentialRampToValueAtTime(.0001, at + .075);
      source.connect(filter).connect(gain).connect(context.destination);
      source.start(at);
    };
    const playTone = (context, at, frequency, duration) => {
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      oscillator.type = "triangle";
      oscillator.frequency.setValueAtTime(frequency, at);
      gain.gain.setValueAtTime(.0001, at);
      gain.gain.exponentialRampToValueAtTime(.065, at + .018);
      gain.gain.exponentialRampToValueAtTime(.0001, at + duration);
      oscillator.connect(gain).connect(context.destination);
      oscillator.start(at);
      oscillator.stop(at + duration + .02);
    };
    const playRewardSound = () => {
      const context = audio();
      context.resume();
      const start = context.currentTime + .04;
      [0.27, .46, .64, .81, .97, 1.12, 1.27].forEach((offset, index) => playCrunch(context, start + offset, 620 + index * 65));
      const reveal = start + rewardData.intro.durationMs / 1000 - .08;
      [523.25, 659.25, 783.99, 1046.5].forEach((frequency, index) => playTone(context, reveal + index * .105, frequency, .34));
    };

    const playAll = (withSound = false) => {
      document.querySelectorAll("#rewards article").forEach(playCard);
      if (withSound) playRewardSound();
    };

    renderMedals();
    renderRewards();
    playAll(false);

    document.querySelector("#replay").addEventListener("click", () => playAll(true));
    document.querySelector("#rewards").addEventListener("click", (event) => {
      const button = event.target.closest(".play-one");
      if (!button) return;
      playCard(button.closest("article"));
      playRewardSound();
    });
    document.querySelector("#medals").addEventListener("click", (event) => {
      const button = event.target.closest(".medal-button");
      if (!button) return;
      const card = document.querySelector(`#rewards article[data-level="${button.dataset.level}"]`);
      card.scrollIntoView({ behavior: "smooth", block: "center" });
      playCard(card);
      playRewardSound();
    });
  </script>
</body>
</html>
