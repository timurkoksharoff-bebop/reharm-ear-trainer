<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d1b">
  <meta name="description" content="Слушай сигнал. Ломай щиты. Лети дальше. Музыкальная космическая аркада Space Music College.">
  <title>Space Music College</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%2371f6d1' d='M32 4 58 54 32 43 6 54Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="game.css?v=0.70">
  <link rel="stylesheet" href="industrial.css?v=0.70">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script>
    window.addEventListener('error',event=>{const el=document.getElementById('startup-error');if(el){el.hidden=false;el.textContent='Ошибка запуска: '+event.message;}});
    // A previously visited Trainer can own this development origin. Match the
    // Trainer's localhost policy so its cache cannot serve an older game build.
    if ('serviceWorker' in navigator && ['localhost','127.0.0.1','[::1]'].includes(location.hostname)) {
      navigator.serviceWorker.getRegistrations().then(async registrations => {
        const controlled = !!navigator.serviceWorker.controller;
        await Promise.all(registrations.map(registration => registration.unregister()));
        if (controlled && !sessionStorage.getItem('ear-game-cache-reset')) {
          sessionStorage.setItem('ear-game-cache-reset', '1');
          location.reload();
        }
      }).catch(() => {});
    }
  </script>
</head>
<body>
  <p id="startup-error" hidden role="alert" style="position:fixed;z-index:1000;top:0;left:0;right:0;background:#582d25;color:white;padding:12px"></p>
  <main class="cabinet">
    <header class="topbar">
      <a class="wordmark" href="./" aria-label="Space Music College, начало"><span class="brand-mark">≋</span><span>SPACE MUSIC <b>COLLEGE</b></span></a>
      <span class="prototype">BUILD 070</span>
      <button id="home" class="home-button" type="button" aria-label="Вернуться в главное меню">HOME</button>
      <button id="language" class="language" type="button">RU / EN</button>
      <button id="pause" class="icon-button" aria-label="Пауза" disabled>Ⅱ</button>
    </header>
    <section class="flight" aria-label="Игровое поле">
      <div class="machine-rail left-rail" aria-hidden="true"><i></i><i></i><i></i><b>⚙</b><i></i><i></i><b>⚙</b><i></i></div>
      <div class="machine-rail right-rail" aria-hidden="true"><i></i><b>⚙</b><i></i><i></i><i></i><b>⚙</b><i></i></div>
      <canvas id="space" aria-label="Перетаскивай корабль по полю или управляй стрелками. Ответы — кнопки под полем."></canvas>
      <div class="hud" aria-live="off">
        <div><span class="micro" id="sector-name">СЕКТОР 01 · МАЯК</span><strong id="score">000000</strong></div>
        <div class="hud-right"><span class="micro">ЩИТ КОРАБЛЯ</span><span id="health" aria-label="Щит: 5 из 5">▰▰▰▰▰</span></div>
      </div>
      <div class="route-track" id="route-track" aria-label="Прогресс сектора"></div>
      <div class="planet-name" id="planet-name"></div>
      <div class="effects" id="effects"></div>
      <div id="enemy-label" class="enemy-label" hidden><span>HYDRA / 01</span><div id="shield-tags"></div></div>
      <div id="signal" class="signal" aria-live="polite"><span class="signal-dot"></span><span id="signal-text">Ожидание пилота</span></div>
      <div id="feedback" class="feedback" role="status"></div>
      <div class="flight-bottom"><span id="recognized-chord" class="recognized-chord" aria-label="Последняя распознанная цифровка"></span><span id="weapon">ИМПУЛЬС ×1</span><span id="combo">КОМБО 0</span></div>
      <div id="overlay" class="overlay"></div>
    </section>
    <section class="cockpit" aria-label="Музыкальное оружие">
      <div class="dock-top"><span id="dock-label">ВЫБЕРИ СИГНАЛ — ВЫСТРЕЛИ</span><button id="hint" class="hint" disabled aria-label="Использовать подсказку">? 0</button><button id="replay" class="replay" disabled aria-label="Повторить тонику и сигнал" aria-keyshortcuts="Space" title="Повторить звучание — пробел">↻ <span>Слушать · Space</span></button></div>
      <div class="special-panel" id="special-panel" hidden><b id="special-title"></b><span id="special-detail"></span><div id="special-options"></div></div>
      <div id="capsule-panel" class="capsule-mission" hidden>
        <strong id="capsule-symbol">♭3</strong>
        <div><b>Совпало? Лови кораблём.</b><span id="capsule-rule">Другой интервал — пропусти.</span><small id="capsule-reward"></small></div>
        <button id="interval-reference" aria-label="Послушать образец нужного интервала">♫<span>Образец</span></button>
      </div>
      <div class="weapon-tabs" id="weapon-tabs" hidden><button id="weapon-root" aria-pressed="true">I · Ступень</button><button id="weapon-type" aria-pressed="false">m7 · Тип</button></div>
      <div id="bass-pads" class="pads"></div>
      <div id="quality-panel" hidden><div class="quality-label">ВТОРОЙ ЩИТ · ТИП АККОРДА</div><div id="quality-tabs" class="quality-tabs" hidden><button id="bank-basic" aria-pressed="true">Аккорды</button><button id="bank-altered" aria-pressed="false">Альтерации</button></div><div id="quality-pads" class="pads quality-pads"></div></div>
      <p id="dock-tip" class="dock-tip">Сначала познакомимся со звуками.</p>
    </section>
    <footer><span>Тяни корабль · стрельба автоматическая</span><button id="help" aria-label="Как играть">?</button></footer>
  </main>
  <link rel="stylesheet" href="console.css?v=0.70">
  <script src="game.bundle.js?v=0.70"></script>
</body>
</html>
