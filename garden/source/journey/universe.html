<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EAR YOGA · Твоя вселенная</title><link rel="stylesheet" href="universe.css"></head>
<body>
<canvas id="cosmos" aria-label="Планетарный атлас: вращай жестом, нажимай на планеты" tabindex="0"></canvas>
<div id="planet-labels" aria-hidden="true"></div>
<header class="universe-header"><a class="brand" href="./#awards"><img src="ear-yoga-wordmark.svg" alt="Ear Yoga — Space Music College"></a><a class="back" href="./#board">Достижения ↗</a></header>
<div class="universe-title"><span>КАРТА ПУТЕШЕСТВИЙ</span><h1>Твоя вселенная</h1></div>
<div class="core-axis" id="core-axis" aria-label="Семь наград гармонии"></div>
<aside class="atlas-caption"><i></i><span>У каждого полёта<br>своё созвездие.</span></aside>
<section class="navigation" aria-label="Управление атласом"><p id="navigation-hint">Вращай и наклоняй пространство · выбирай планету</p><div class="navigation-buttons"><button id="rotate-left" aria-label="Повернуть влево">←</button><button id="spin-toggle" aria-pressed="true">Пауза</button><button id="rotate-right" aria-label="Повернуть вправо">→</button><span></span><button id="top-view" aria-label="Ракурс сверху" aria-pressed="false">↗</button><button id="zoom-out" aria-label="Отдалить">−</button><button id="zoom-in" aria-label="Приблизить">+</button><button id="reset-camera" aria-label="Вернуть исходный ракурс">↺</button></div></section>
<button id="worlds-toggle" aria-expanded="false" aria-controls="world-list">Миры <span>08</span> ⌃</button>
<nav id="world-list" aria-label="Музыкальные миры" hidden></nav>
<small class="prototype-note">Визуальный прототип · пример коллекции</small>
<dialog id="celestial-detail" aria-labelledby="detail-title"><button id="detail-close" aria-label="Закрыть">×</button><span id="detail-eyebrow">ТВОЯ КОЛЛЕКЦИЯ</span><canvas id="detail-planet" width="420" height="300"></canvas><div id="detail-medal" class="core-medal" hidden></div><h2 id="detail-title"></h2><p id="detail-description"></p><div id="detail-progress"></div><section id="route-selector" aria-label="Выбор маршрута" hidden><div class="mode-row"><select id="departure-mode" aria-label="Режим полёта"><option value="hard">Преподаватель</option><option value="medium">Студент</option></select></div><div id="route-fork"><button id="route-random"><strong>Случайный полёт</strong><small>Пусть мир выберет маршрут</small></button><button id="route-manual" aria-expanded="false"><strong>Выбрать маршрут</strong><small>Рассмотреть все последовательности</small></button></div><div id="manual-routes" hidden><div id="route-deck" aria-label="Обойма маршрутов"></div><div class="route-controls"><button id="route-prev" aria-label="Предыдущий маршрут">←</button><span id="route-counter"></span><button id="route-next" aria-label="Следующий маршрут">→</button></div><div class="departure"><button id="route-launch">Начать полёт →</button></div></div><p class="rating-legend">★ Начало · ★★ Уверенно · ★★★ Отлично<br>★★★★ Мастерски · ★★★★★ Исключительно</p></section><button id="detail-return">Вернуться к звёздам</button></dialog>
<script type="module" src="universe.js"></script>
</body></html>
