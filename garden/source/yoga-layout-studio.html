<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#101c24;color:#e3eee9;font:13px/1.5 system-ui}.studio{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100dvh;overflow:hidden}.preview-area{display:grid;place-items:center;position:relative;min-height:0;background:radial-gradient(ellipse,#28414a,#101c24)}.phone-space{position:relative;flex:none}iframe{position:absolute;inset:0;width:390px;height:692px;transform-origin:top left;border:1px solid #badace44;border-radius:16px;background:#142536}aside{overflow:auto;padding:20px;background:#172932;border-left:1px solid #b7ddcc22}h1{font-size:18px;margin:0 0 8px}p{color:#b2c8c5;font-size:12px;margin:0 0 14px}h2{font-size:14px;color:#d7e9dc;margin:20px 0 4px}label{display:grid;grid-template-columns:1fr auto;gap:5px;margin:12px 0;font-size:12px}input{grid-column:1/-1;width:100%;accent-color:#a1dec7}output{font-size:11px;color:#a9d6c8;font-variant-numeric:tabular-nums}select,button{width:100%;padding:9px;border:1px solid #9cc2b75c;border-radius:8px;background:#243c44;color:#eaf4ed;font:inherit}select{grid-column:1/-1}button{margin:5px 0;cursor:pointer}button.primary{background:#345b53}details{border-bottom:1px solid #b8ddc322;padding-bottom:9px}summary{cursor:pointer;font-weight:600;padding:14px 0 4px}.status{margin-top:10px;color:#b7dfc9}.tip{position:absolute;bottom:6px;color:#b3ccc3;font-size:11px;pointer-events:none}

</style></head><body><main class="studio"><section class="preview-area" aria-label="Предпросмотр стартового экрана"><div class="phone-space"><iframe title="Стартовый экран Ear Yoga" src="index.html?cover-preview=1"></iframe></div><span class="tip">Перетаскивай надписи и группы кнопок прямо на макете</span></section><aside id="layout-editor"><h1>Стартовый экран</h1><p>Все элементы разблокированы. Этот редактор не меняет игру и опубликованную сборку. Настройки сохраняются здесь автоматически.</p><label>Размер экрана<select id="screen"><option value="390x692">390 × 692 · компактный</option><option value="390x844">390 × 844 · высокий</option><option value="430x932">430 × 932 · большой</option></select></label><div id="controls"></div><button id="export-layout" class="primary">Скачать макет JSON</button><button id="reset-layout">Вернуть исходный макет</button><p id="layout-status" class="status" aria-live="polite">После настройки скачай макет и передай его мне — перенесу точно.</p></aside></main><script src="yoga-layout-editor.js"></script></body></html>
