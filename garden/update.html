<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061827"><title>EAR YOGA · Обновление</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#061827;color:#f1dfb9;font:20px Georgia,serif;text-align:center}main{max-width:28rem;padding:28px}h1{font-weight:400}p{font:16px/1.5 system-ui,sans-serif;color:#b6d5d5}button,a{display:inline-block;margin:10px;padding:12px 18px;border:1px solid #d6bd89;border-radius:12px;background:transparent;color:inherit;font:16px system-ui,sans-serif}button[hidden]{display:none}</style></head><body><main><h1>Ear Yoga</h1><p id="status" role="status">Загружаем обновление…</p><button id="retry" hidden>Повторить</button><a href="./">Открыть игру</a></main><script>
(async()=>{
 const version='1.39',status=document.querySelector('#status'),retry=document.querySelector('#retry');retry.onclick=()=>location.reload();
 try{
  if(!navigator.serviceWorker||!navigator.onLine)throw Error('Для обновления нужно подключение к интернету. Сохранённая игра доступна по ссылке ниже.');
  const worker=navigator.serviceWorker;
  await new Promise(async(resolve,reject)=>{
   let done=false;
   const timer=setTimeout(()=>finish(Error('Обновление ещё загружается. Нажмите «Повторить».')),60000);
   function finish(error){if(done)return;done=true;clearTimeout(timer);worker.removeEventListener('controllerchange',check);error?reject(error):resolve();}
   function check(){const controller=worker.controller;if(!controller||done)return;const channel=new MessageChannel(),timeout=setTimeout(()=>channel.port1.close(),2000);channel.port1.onmessage=event=>{clearTimeout(timeout);channel.port1.close();if(controller===worker.controller&&event.data?.type==='EAR_YOGA_VERSION'&&event.data.version===version)finish();};controller.postMessage({type:'EAR_YOGA_VERSION'},[channel.port2]);}
   worker.addEventListener('controllerchange',check);
   try{const registration=await worker.register('./service-worker.js',{scope:'./',updateViaCache:'none'});await registration.update();check();}catch(error){finish(error);}
  });
  location.replace('./'+(new URLSearchParams(location.search).has('offline-test')?'?offline-test=1':''));
 }catch(error){status.textContent=error.message||'Не удалось загрузить обновление. Попробуйте ещё раз.';retry.hidden=false;}
})();
</script></body></html>
