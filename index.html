<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef1ed">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Reharm Ear">
  <meta name="screen-orientation" content="portrait">
  <title>Reharm Ear Trainer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-atmosphere="dawn">
  <div class="orientation-guard" role="status">
    <strong>Turn your iPhone upright</strong>
  </div>

  <main class="app-shell">
    <header class="topbar">
      <div class="brand-lockup" aria-label="Ear Reharm Trainer">
        <img class="brand-emblem" src="icon-192.png" alt="" aria-hidden="true">
        <div class="brand-wordmark">
          <span class="brand-name">EAR</span>
          <span class="brand-subtitle">REHARM TRAINER</span>
        </div>
      </div>
      <div class="topbar-title">
        <p class="eyebrow" id="chapterLabel">Reharmonization Techniques</p>
        <h1>Chord Progressions</h1>
      </div>
      <button
        class="icon-button settings-button"
        id="settingsButton"
        type="button"
        title="Settings"
        aria-label="Open settings"
        aria-expanded="false"
        aria-controls="settingsPanel"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2"></circle>
          <path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5 7 7M17 17l1.5 1.5M18.5 5.5 17 7M7 17l-1.5 1.5"></path>
        </svg>
      </button>
    </header>

    <button class="settings-scrim" id="settingsScrim" type="button" aria-label="Close settings" hidden></button>
    <aside class="settings-panel" id="settingsPanel" aria-label="Settings" hidden>
      <div class="settings-heading">
        <div>
          <p class="eyebrow">Listening setup</p>
          <h2>Settings</h2>
        </div>
        <button class="settings-close" id="settingsCloseButton" type="button" aria-label="Close settings">×</button>
      </div>
      <section class="controls" aria-label="Exercise settings">
        <label class="chapter-control">
          <span>Chapter</span>
          <select id="chapterSelect"></select>
        </label>
        <label class="example-control">
          <span>Exercise</span>
          <select id="exerciseSelect"></select>
        </label>
        <label>
          <span>Tempo</span>
          <select id="tempoSelect">
            <option value="1.8" selected>Slow</option>
            <option value="1.45">Medium</option>
            <option value="1.1">Fast</option>
          </select>
        </label>
        <label>
          <span>Sound</span>
          <select id="soundSelect">
            <option value="piano" selected>Piano</option>
            <option value="piano-legato">Piano legato</option>
            <option value="piano-upright">Piano + upright bass</option>
            <option value="electric-piano">Electric piano</option>
            <option value="organ">Organ</option>
            <option value="bass">Bass</option>
          </select>
        </label>
        <div class="mode-control">
          <span>Notation</span>
          <div class="segmented" role="group" aria-label="Chord notation">
            <button class="active" type="button" data-mode="degree">Scale degrees</button>
            <button type="button" data-mode="symbol">Chord symbols</button>
          </div>
        </div>
      </section>
      <button class="settings-reset" id="resetStatsButton" type="button">Reset statistics</button>
    </aside>

    <section class="exercise">
      <div class="exercise-heading">
        <div>
          <p class="source" id="sourceLabel"></p>
          <h2 id="promptLabel"></h2>
        </div>
        <div class="exercise-tools">
          <button
            class="favorite-button"
            id="favoriteButton"
            type="button"
            title="Add to favorites"
            aria-label="Add to favorites"
            aria-pressed="false"
          >♡</button>
          <span class="key-badge" id="keyBadge">Key hidden</span>
        </div>
      </div>

      <div class="matrix-scroll" id="matrixScroll">
        <div class="position-legend" id="positionLegend" aria-hidden="true"></div>
        <div class="answer-grid" id="answerGrid"></div>
      </div>

      <p class="feedback" id="feedback" aria-live="polite">
        Tonic first, then the progression.
      </p>
    </section>

    <section class="actions" aria-label="Exercise actions">
      <button
        class="history-button"
        id="previousButton"
        type="button"
        title="Previous sequence"
        aria-label="Previous sequence"
        disabled
      >←</button>
      <button class="secondary" id="showButton" type="button">Show answer</button>
      <button class="secondary" id="reviewButton" type="button" title="Play with highlighting" disabled>▶ Review</button>
      <div class="playback-controls" id="playbackControls" aria-label="Sequence playback">
        <button class="segment-play-button" type="button" data-play-segment="0" hidden></button>
        <button class="play-button" id="playButton" type="button" title="Play full sequence" aria-label="Play full sequence">▶</button>
        <button class="segment-play-button" type="button" data-play-segment="1" hidden></button>
      </div>
      <button class="primary" id="nextButton" type="button" title="Skip without changing statistics">Skip</button>
    </section>

    <section class="stats" aria-label="Statistics">
      <div>
        <strong id="completedStat">0</strong>
        <span>Attempts</span>
      </div>
      <div>
        <strong id="accuracyStat">0%</strong>
        <span>First try</span>
      </div>
      <div>
        <strong id="streakStat">0</strong>
        <span>Streak</span>
      </div>
      <div>
        <strong id="revealedStat">0</strong>
        <span>Revealed</span>
      </div>
    </section>

    <section class="piano-panel" aria-label="Keyboard for checking chords">
      <div class="piano-panel-heading">
        <strong>Keyboard</strong>
        <button class="piano-stop" id="pianoStopButton" type="button" title="Stop keyboard sounds" aria-label="Stop keyboard sounds">■</button>
      </div>
      <div class="piano-scroll">
        <div class="piano" id="pianoKeyboard" aria-label="Piano keyboard from C3 to C5"></div>
      </div>
    </section>

  </main>

  <aside
    class="voicing-popover"
    id="voicingPopover"
    role="dialog"
    aria-modal="false"
    aria-labelledby="voicingTitle"
    hidden
  >
    <div class="voicing-heading">
      <div>
        <p class="voicing-eyebrow">Sounding notes</p>
        <h2 id="voicingTitle">Chord voicing</h2>
      </div>
      <button
        class="voicing-close"
        id="voicingCloseButton"
        type="button"
        aria-label="Close chord notes"
      >×</button>
    </div>
    <div class="voicing-staff" id="voicingStaff"></div>
    <p class="voicing-notes" id="voicingNotes"></p>
    <p class="voicing-meta" id="voicingMeta"></p>
  </aside>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", async () => {
        const isLocalPreview = (
          location.hostname === "127.0.0.1"
          || location.hostname === "localhost"
        );
        if (isLocalPreview) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
          if (
            navigator.serviceWorker.controller
            && sessionStorage.getItem("reharm-local-sw-cleared") !== "true"
          ) {
            sessionStorage.setItem("reharm-local-sw-cleared", "true");
            location.reload();
          }
          return;
        }
        sessionStorage.removeItem("reharm-local-sw-cleared");
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
